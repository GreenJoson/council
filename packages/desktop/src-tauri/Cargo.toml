[package]
name = "council-desktop"
version = "0.5.8"
description = "Council local multi-agent desktop workspace"
edition = "2024"
rust-version = "1.85"

[lib]
name = "council_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
council-core = { path = "../../../crates/council-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"

# 仅用于向本地 Agent 服务子进程的进程组发送 SIGTERM/SIGKILL；
# libc 已在 tauri 依赖树内，不引入新的重依赖。
[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled"] }
tempfile = "=3.27.0"
