[package]
name = "council-desktop"
version = "0.2.1"
description = "Council local multi-agent desktop workspace"
edition = "2024"
rust-version = "1.85"

[lib]
name = "council_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
council-core = { path = "../../../crates/council-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"

[dev-dependencies]
tempfile = "=3.27.0"
