<?xml version="1.0" encoding="UTF-8"?>
<!--
  Council 应用图标源文件（1024×1024）。
  构图：macOS 规格的圆角方形底（824 主体 + 四周 100 安全边距），中心「三席位 + 三段弧 + 共识星」：
  三个实心圆是围坐的 Agent，三段弧是它们之间的议事环，中心四角星是收敛出的共识。
  符号几何与 packages/web 的 BrandLogo、public/favicon.svg 共用同一套 32 单位坐标（见下方 transform），改一处请同步另两处。
  配色：深蓝底板（navy 渐变）+ 亮蓝符号 + 白色共识星，取 theme.css 的 color-agent-council 色相加深加饱和，Dock 上与浅色界面形成对比。
  （XML 注释里不能出现连续两个连字符，所以 token 名省略了前缀）
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3399"/>
      <stop offset="1" stop-color="#0a1246"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d86ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d86ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d9bff"/>
      <stop offset="1" stop-color="#1f4fd6"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05081f" flood-opacity="0.35"/>
    </filter>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#040a2e" flood-opacity="0.55"/>
    </filter>
    <filter id="starglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="plateclip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <style>
    .arc { fill: none; stroke: url(#ink); stroke-width: 3.0; stroke-linecap: round; }
    .seat { fill: url(#ink); }
    .star { fill: #ffffff; }
    .starhalo { fill: #9cc2ff; }
  </style>
  <!-- 底板 + 中心光晕 + 顶部高光描边 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#drop)"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)" clip-path="url(#plateclip)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  <!-- 符号：32 单位坐标，主体 1..31 映射到 100..924；先画一层星光晕，再画带投影的符号 -->
  <g transform="translate(100 100) scale(27.4667) translate(-1 -1)">
    <circle class="starhalo" cx="16" cy="16" r="4.8" opacity="0.7" filter="url(#starglow)"/>
  </g>
  <g transform="translate(100 100) scale(27.4667) translate(-1 -1)" filter="url(#depth)">
    <path class="arc" d="M 20.747 8.120 A 9.2 9.2 0 0 1 25.198 15.829"/>
    <path class="arc" d="M 20.451 24.052 A 9.2 9.2 0 0 1 11.549 24.052"/>
    <path class="arc" d="M 6.802 15.829 A 9.2 9.2 0 0 1 11.253 8.120"/>
    <circle class="seat" cx="16.000" cy="6.800" r="2.7"/>
    <circle class="seat" cx="23.967" cy="20.600" r="2.7"/>
    <circle class="seat" cx="8.033" cy="20.600" r="2.7"/>
    <path class="star" d="M 16 11.9 C 16.3 14.9 17.1 15.7 20.1 16 C 17.1 16.3 16.3 17.1 16 20.1 C 15.7 17.1 14.9 16.3 11.9 16 C 14.9 15.7 15.7 14.9 16 11.9 Z"/>
  </g>
</svg>
