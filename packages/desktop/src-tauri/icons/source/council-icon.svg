<?xml version="1.0" encoding="UTF-8"?>
<!--
  Council 应用图标源文件（1024×1024）。
  构图：macOS 规格的圆角方形底（824 主体 + 四周 100 安全边距），中心「圆桌 + 三席位 + 共识点」。
  符号几何与 packages/web 的 BrandLogo 共用同一套 32 单位坐标（见下方 transform），改一处请同步另一处。
  配色取自 theme.css 浅色主题：底 blob-a 到 color-canvas-deep 的竖向渐变，墨色 color-primary，共识点 color-agent-council。
  （XML 注释里不能出现连续两个连字符，所以 token 名省略了前缀）
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#10141c" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- 底板 + 顶部高光描边 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#drop)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
  <!-- 符号：32 单位坐标，主体 1..31 映射到 100..924 -->
  <g transform="translate(100 100) scale(27.4667) translate(-1 -1)">
    <circle cx="16" cy="17.6" r="5.4" fill="none" stroke="#1c1f26" stroke-width="1.7"/>
    <circle cx="16" cy="17.6" r="1.6" fill="#3f4c66"/>
    <circle cx="16" cy="7.2" r="2.2" fill="#1c1f26"/>
    <circle cx="6.99" cy="22.8" r="2.2" fill="#1c1f26"/>
    <circle cx="25.01" cy="22.8" r="2.2" fill="#1c1f26"/>
  </g>
</svg>
