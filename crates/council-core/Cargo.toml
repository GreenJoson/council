[package]
name = "council-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Council SQLite-compatible content storage core"
publish = false

[dependencies]
chrono = "=0.4.45"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.19"
uuid = { version = "=1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
